<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能客服 · 电商助手</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #e7eef9 0%, #f5f8fd 45%, #edf1f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-container {
      width: 440px;
      max-width: 100%;
      height: min(94vh, 840px);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(31, 55, 96, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 头部 */
    .chat-header {
      background: linear-gradient(135deg, #5b8cff 0%, #3b82f6 55%, #2f6fe0 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }
    .chat-header .info .name { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    .chat-header .info .status {
      font-size: 12px;
      opacity: 0.92;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .chat-header .info .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25);
    }

    /* 消息区 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #f6f8fc;
    }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d5dde9; border-radius: 3px; }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: #c2cddd; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-row .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: #e6ecf6;
      box-shadow: 0 2px 5px rgba(31, 55, 96, 0.08);
    }
    .msg-row.user .avatar {
      background: linear-gradient(135deg, #5b8cff, #3b82f6);
    }
    .msg-row .body { max-width: 76%; display: flex; flex-direction: column; }
    .msg-row.user .body { align-items: flex-end; }

    .bubble {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.62;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.assistant .bubble {
      background: #fff;
      color: #1f2937;
      border: 1px solid #edf0f5;
      border-bottom-left-radius: 6px;
      box-shadow: 0 3px 8px rgba(31, 55, 96, 0.06);
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, #5b8cff, #3b82f6);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.28);
    }
    .time { font-size: 11px; color: #9aa5b5; margin-top: 5px; padding: 0 4px; }

    /* 打字动画 */
    .typing { display: flex; gap: 4px; padding: 3px 2px; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b6c2d4;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* 快捷问题 */
    .quick-questions {
      display: flex;
      gap: 8px;
      padding: 10px 16px 0;
      flex-wrap: wrap;
      background: #f6f8fc;
    }
    .quick-questions button {
      border: 1px solid #dfe6f0;
      background: #fff;
      color: #4b5563;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quick-questions button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 输入区 */
    .chat-input {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      background: #fff;
      border-top: 1px solid #f0f2f6;
    }
    .chat-input input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      outline: none;
      background: #f6f8fc;
      transition: border 0.15s, background 0.15s;
    }
    .chat-input input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    .chat-input button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b8cff, #3b82f6);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .chat-input button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.45);
    }
    .chat-input button:disabled {
      background: #c3d2e8;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="info">
        <div class="name">智能客服</div>
        <div class="status"><span class="dot"></span>在线 · 随时为您服务</div>
      </div>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="quick-questions">
      <button>查订单 20261103001</button>
      <button>怎么退换货</button>
      <button>极光笔记本多少钱</button>
      <button>包邮吗</button>
    </div>

    <div class="chat-input">
      <input id="input" placeholder="输入你的问题，按回车发送" />
      <button id="send" title="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3.4 20.4l17.6-8.4L3.4 3.6l.01 6.5L15 12 3.41 13.9z" fill="#fff"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // 会话 ID 存 localStorage，刷新页面仍保持同一会话（记住上下文）
    let sessionId = localStorage.getItem("chat_session");
    if (!sessionId) {
      sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
      localStorage.setItem("chat_session", sessionId);
    }

    function now() {
      return new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "🤖";
      const body = document.createElement("div");
      body.className = "body";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      const time = document.createElement("div");
      time.className = "time";
      time.textContent = now();
      body.appendChild(bubble);
      body.appendChild(time);
      row.appendChild(avatar);
      row.appendChild(body);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "msg-row assistant";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🤖";
      const body = document.createElement("div");
      body.className = "body";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      body.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(body);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function removeTyping(row) {
      if (row && row.parentNode) row.parentNode.removeChild(row);
    }

    async function send(text) {
      const message = (text !== undefined ? text : inputEl.value.trim());
      if (!message || sendBtn.disabled) return;
      inputEl.value = "";
      addMessage("user", message);
      sendBtn.disabled = true;

      let bubble = null;
      let typingRow = addTyping();

      try {
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: message }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (!line) continue;
            try {
              const obj = JSON.parse(line);
              if (obj.delta) {
                if (!bubble) {
                  removeTyping(typingRow);
                  typingRow = null;
                  bubble = addMessage("assistant", "");
                }
                bubble.textContent += obj.delta;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch (e) {
              /* 忽略无法解析的行 */
            }
          }
        }
        if (!bubble) {
          removeTyping(typingRow);
          typingRow = null;
          addMessage("assistant", "（未收到回复，请稍后再试）");
        }
      } catch (err) {
        removeTyping(typingRow);
        typingRow = null;
        if (!bubble) addMessage("assistant", "（网络错误，请确认服务已启动）");
        else bubble.textContent += "\n（连接中断）";
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", function () { send(); });
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") send();
    });
    document.querySelectorAll(".quick-questions button").forEach(function (btn) {
      btn.addEventListener("click", function () { send(btn.textContent); });
    });

    addMessage("assistant", "您好，我是店铺智能客服 🤖\n可以帮您查商品、订单、物流，也能回答退换货等政策问题。");
  </script>
</body>
</html>
